# Example profiles.toml for dnstt-cli
# This file lives in ~/.config/dnstt-cli/profiles.toml on Linux
# or %APPDATA%\dnstt-cli\profiles.toml on Windows.

default_profile = "home"

[profile.home]
domain       = "t.example.com"              # Tunnel domain
pubkey       = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"  # Server's Noise public key (64 hex digits)
resolvers    = [                            # Resolvers to tunnel through (empty becomes ["network"])
  "udp:192.0.2.53:53",                      #   Plain DNS over UDP to an address
  "doh:https://doh.example/dns-query@192.0.2.1",  # DoH with pinned address
  "dot:dot.example:853@192.0.2.2",          #   DoT with pinned address
  "network",                                #   The network's DNS (ISP's resolver) at each dial
]
bootstrap    = []                           # Bootstrap DNS servers by address for resolver names; empty — network's DNS
utls         = ""                           # uTLS distribution; empty — the DefaultUTLS distribution (P5)
datapath     = "tun"                        # "tun" (system-wide VPN) or "socks" (local proxy)
kill_switch  = true                         # (tun only) Block traffic while tunnel is down
tun_dns      = "1.1.1.1"                    # DNS behind the server for tun mode
payload_size = 0                            # cap on the payload per query, bytes; 0 — the domain's maximum

[profile.home.exit]
type         = "socks5"                     # socks5 | http | ssh (ssh is stage E5)
user         = "user"                       # Exit username; empty — no authentication
password_ref = "secretservice:0123456789abcdef"  # Reference to exit password in secret store
one_write    = false                       # socks5 only: greeting, login and CONNECT in one write (off by default)

[profile.home.socks]
listen       = "127.0.0.1:1080"             # Local SOCKS5 proxy address
